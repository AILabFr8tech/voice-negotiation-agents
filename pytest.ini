[pytest]
# rootdir es la raíz del repo, para que `shared` y `poc1_pipecat` sean
# importables como paquetes desde cualquier PoC sin instalarlos: `poc1_pipecat`
# es un proyecto virtual de uv y no se instala en el entorno.
pythonpath = .
testpaths = shared poc1_pipecat poc2_livekit poc3_gpt_live validation
